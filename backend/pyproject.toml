[project]
name = "agentflow-backend"
version = "0.1.0"
description = "AgentFlow backend — FastAPI + Socket.IO orchestrator for Claude and OpenAI coding agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "aiosqlite==0.20.0",
    "python-socketio==5.11.4",
    "pydantic==2.9.2",
    "openai>=1.30.0",
    "cryptography>=50.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.uv]
package = false
